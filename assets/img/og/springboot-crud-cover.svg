<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SpringBoot CRUD API Cover</title>
  <desc id="desc">Custom cover for the SpringBoot CRUD API article.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="55%" stop-color="#1f3f8f" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="78" y="78" width="1044" height="474" rx="30" fill="#ffffff" fill-opacity="0.08" stroke="#dbeafe" stroke-opacity="0.26" />
  <text x="118" y="160" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">SPRINGBOOT DEEP DIVE</text>
  <text x="118" y="278" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800">CRUD API</text>
  <text x="118" y="356" fill="#e0f2fe" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="600">Controller · Service · Repository</text>
  <text x="118" y="434" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="30">DTO separation, status codes, 404 handling, end-to-end flow</text>
