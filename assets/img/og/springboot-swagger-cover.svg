<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SpringBoot Swagger Cover</title>
  <desc id="desc">Custom cover for the SpringBoot Swagger and OpenAPI article.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1147" />
      <stop offset="55%" stop-color="#5b21b6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="76" y="76" width="1048" height="478" rx="30" fill="#ffffff" fill-opacity="0.07" stroke="#f3e8ff" stroke-opacity="0.24" />
  <text x="118" y="160" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">SPRINGBOOT DOCUMENTATION</text>
  <text x="118" y="278" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800">Swagger UI</text>
  <text x="118" y="356" fill="#f5e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="600">OpenAPI with springdoc-openapi</text>
  <text x="118" y="434" fill="#f3e8ff" font-family="Segoe UI, Arial, sans-serif" font-size="30">Auto-generated API docs, dev setup, production cautions</text>
  <g transform="translate(820 165)">
    <rect width="220" height="250" rx="24" fill="#faf5ff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.30" />
    <rect x="32" y="40" width="156" height="20" rx="10" fill="#ffffff" fill-opacity="0.70" />
    <rect x="32" y="92" width="120" height="18" rx="9" fill="#e9d5ff" />
    <rect x="32" y="132" width="156" height="18" rx="9" fill="#d8b4fe" />
    <rect x="32" y="172" width="98" height="18" rx="9" fill="#c084fc" />
  </g>
</svg>
