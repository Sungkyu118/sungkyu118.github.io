<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Redis Overview Cover</title>
  <desc id="desc">Custom cover for the Redis practical overview article.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d1f32" />
      <stop offset="52%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="76" y="76" width="1048" height="478" rx="30" fill="#ffffff" fill-opacity="0.08" stroke="#ffe4e6" stroke-opacity="0.24" />
  <text x="118" y="160" fill="#fecdd3" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">REDIS PRACTICAL GUIDE</text>
  <text x="118" y="278" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800">When to Use Redis</text>
